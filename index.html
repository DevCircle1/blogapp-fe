<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/3.png" />
  <link rel="apple-touch-icon" href="/2.png" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <meta name="theme-color" content="#020617" />

  <!--
      These are the neutral defaults for the SPA shell (served as app.html for
      routes that are not prerendered, such as blog articles). Every route
      replaces them with its own values via the Seo component on mount, and the
      prerender step bakes real per-page tags into the static HTML files.
      Deliberately no canonical here: the shell is served for many URLs.
    -->
  <title>Talk &amp; Tool | Free Online Tools and Practical Guides</title>
  <meta name="description"
    content="Free online tools, calculators, converters, developer utilities, and practical guides from Talk &amp; Tool." />
  <meta property="og:site_name" content="Talk &amp; Tool" />
  <meta property="og:image" content="https://talkandtool.com/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />

  <script>
    // GA4, Clarity, and AdSense are the biggest contributors to blocking
    // time (measured ~1.2s combined main-thread work from AdSense alone on
    // a tool page) but nothing they do is needed for first paint or LCP.
    // The queue stubs below let app code (gtag(), adsbygoogle.push()) call
    // them immediately without erroring; the real scripts load once the
    // browser is idle, or immediately on the visitor's first interaction/
    // scroll so nothing is lost if they engage before the idle callback
    // fires. send_page_view is off because App.jsx fires page_view itself
    // on every route change (gtag.js's own auto-pageview only fires once,
    // on load, which doesn't see client-side route changes in an SPA).
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-PY1TRQG0PQ', { send_page_view: false });
    window.adsbygoogle = window.adsbygoogle || [];

    function loadDeferredThirdParties() {
      if (window.__thirdPartiesLoaded) return;
      window.__thirdPartiesLoaded = true;

      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-PY1TRQG0PQ';
      document.head.appendChild(ga);

      (function (c, l, a, r, i, t, y) {
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
        t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "ykeu033jrf");

      var ads = document.createElement('script');
      ads.async = true;
      ads.crossOrigin = 'anonymous';
      ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3784907597850575';
      document.head.appendChild(ads);
    }

    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadDeferredThirdParties, { timeout: 4000 });
    } else {
      setTimeout(loadDeferredThirdParties, 3000);
    }
    ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
      window.addEventListener(evt, loadDeferredThirdParties, { once: true, passive: true });
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <noscript>
    Talk &amp; Tool provides free online calculators, converters, writing tools, and developer utilities.

    <a href="/tools">Browse all tools</a> or <a href="/blogs">read the blog</a>.
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
