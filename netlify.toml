[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These Vite values are intentionally compiled into the public browser bundle.
  # Keep secret scanning enabled for every other environment variable.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_BLOG_IMAGES_BUCKET"

# ---------------------------------------------------------------- redirects
# Order matters: Netlify applies the first matching rule, and static files in
# the publish directory are served before any of these are considered.

# Canonical host. Without this, https://www.talkandtool.com and
# https://talkandtool.com are two crawlable copies of every page.
[[redirects]]
  from = "https://www.talkandtool.com/*"
  to = "https://talkandtool.com/:splat"
  status = 301
  force = true

# The standalone profit margin page was replaced by the fuller margin and
# markup tool. A 301 passes its accumulated ranking signals to the new URL
# instead of leaving two competing pages.
[[redirects]]
  from = "/profit-margin-calculator"
  to = "/tools/margin-markup-calculator"
  status = 301
  force = true

# SPA fallback. Points at app.html rather than index.html so the prerendered
# homepage at index.html is not served for every unmatched path — that would
# put the homepage's canonical tag on blog articles and 404s alike.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# ------------------------------------------------------------------ headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML must revalidate, otherwise a cached shell keeps serving stale meta tags
# and stale content after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
