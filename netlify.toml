[build]
  command = "npm run build"

[build.environment]
  # Next 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
  # These values are intentionally compiled into the public browser bundle.
  # Keep secret scanning enabled for every other environment variable.
  # (The VITE_ names are still accepted as a fallback; see next.config.mjs.)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_BLOG_IMAGES_BUCKET,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_BLOG_IMAGES_BUCKET"

# Redirects (www -> apex, the retired profit-margin page, the current tax year) and
# the security/cache headers live in next.config.mjs, so they behave the same on
# any host. The canonical-host redirect is repeated here so Netlify answers it at
# the edge without invoking the Next server.
[[redirects]]
  from = "https://www.talkandtool.com/*"
  to = "https://talkandtool.com/:splat"
  status = 301
  force = true

# The Next.js runtime is installed automatically by Netlify for Next sites. There
# is no publish directory and no SPA fallback: every URL is either a prerendered
# page or a real 404 (src/app/global-not-found.jsx).
